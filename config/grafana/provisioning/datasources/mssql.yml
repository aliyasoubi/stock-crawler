apiVersion: 1
datasources:
  - name: StockFundamentals
    uid: stockfundamentals-mssql
    type: mssql
    access: proxy
    url: mssql:1433
    database: $MSSQL_DATABASE
    user: grafana_reader
    secureJsonData:
      password: $MSSQL_GRAFANA_PASSWORD
    jsonData:
      encrypt: "true"
      tlsSkipVerify: true      # self-signed certificate inside the Compose network only
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
